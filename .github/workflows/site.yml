# GitHub Pages: zgix.click official site + bilingual docs.
#
# Build matrix (three zdoc passes, merged into one artifact):
#   1. `zdoc site`   — the landing page (zine.ziggy site mode)
#   2. `zdoc docs`   — English docs tree  -> /docs
#   3. `zdoc docs`   — Chinese docs tree  -> /docs/zh
# Deploy via the official Pages actions (OIDC, no tokens in repo settings).
#
# Zig comes from zigup (the same installer the local toolchain uses):
# setup-zig actions lag behind the 0.17 builds index, the official
# download URL is not always populated yet, and the repo's devenv pin
# predates nixpkgs' zig_0_17 attribute. zigup resolves "0.17.0" from
# ziglang.org/builds on the runner's clean network.

name: site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: chy3xyz/zdoc
          path: zdoc

      # zigup installs to $XDG_DATA_HOME/zigup (default ~/.local/share/zigup).
      - name: Install zig (zigup, same installer as the local toolchain)
        run: |
          curl -sSfL -o /tmp/zigup.tgz \
            https://github.com/marler8997/zigup/releases/latest/download/zigup-x86_64-linux.tar.gz
          tar -xzf /tmp/zigup.tgz -C /usr/local/bin zigup
          zigup fetch 0.17.0
          echo "$HOME/.local/share/zigup/0.17.0/files" >> "$GITHUB_PATH"
          zig version

      # -Dno-git-version: zdoc's build refuses zon versions not ahead of
      # its last git tag without it (its maintainers' bump ritual).
      - name: Build zdoc
        run: sh -c 'cd zdoc && zig build -Doptimize=ReleaseSafe -Dno-git-version'

      - name: Build landing + docs (en, zh)
        run: |
          sh -c '
            cd website
            ZDOC=../zdoc/zig-out/bin/zdoc
            "$ZDOC" site    -f
            "$ZDOC" docs docs    --output public/docs    --url-prefix docs    --title zgix      --lang en     -f --strict
            "$ZDOC" docs docs-zh --output public/docs/zh --url-prefix docs/zh --title "zgix 文档" --lang zh-CN -f --strict
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
