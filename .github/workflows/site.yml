# GitHub Pages: zgix.click official site + bilingual docs.
#
# Build matrix (three zdoc passes, merged into one artifact):
#   1. `zdoc site`   — the landing page (zine.ziggy site mode)
#   2. `zdoc docs`   — English docs tree  -> /docs
#   3. `zdoc docs`   — Chinese docs tree  -> /docs/zh
# Deploy via the official Pages actions (OIDC, no tokens in repo settings).
#
# Zig comes from the repo's own devenv (Nix), same toolchain as CI:
# setup-zig actions lag behind the 0.17 dev builds index, and the official
# download URL is not always populated yet — devenv.lock is the one pin
# that has never drifted.

name: site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: chy3xyz/zdoc
          path: zdoc

      # Same provisioning as ci.yml: single-user Nix + prebuilt devenv.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes

      - name: Set up devenv binary cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true

      - name: Install devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/v2.1.2

      # -Dno-git-version: zdoc's build refuses zon versions not ahead of
      # its last git tag without it (its maintainers' bump ritual).
      # Everything runs from the repo root so devenv finds its devenv.yaml.
      - name: Build zdoc
        run: devenv shell -- sh -c 'cd zdoc && zig build -Doptimize=ReleaseSafe -Dno-git-version'

      - name: Build landing + docs (en, zh)
        run: |
          devenv shell -- sh -c '
            cd website
            ZDOC=../zdoc/zig-out/bin/zdoc
            "$ZDOC" site    -f
            "$ZDOC" docs docs    --output public/docs    --url-prefix docs    --title zgix      --lang en     -f --strict
            "$ZDOC" docs docs-zh --output public/docs/zh --url-prefix docs/zh --title "zgix 文档" --lang zh-CN -f --strict
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
