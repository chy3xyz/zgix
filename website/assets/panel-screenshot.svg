  <text class="ink t-label" x="214" y="472">RAW SCRAPE</text>
  <rect class="surface" x="214" y="484" width="700" height="220" rx="8"/>
  <text class="muted t-label" x="230" y="510">zgix_info{version="0.9.0"} 1</text>
  <text class="muted t-label" x="230" y="532">zgix_listener_info{bind="0.0.0.0:443",kind="http",routes="12"} 1</text>
