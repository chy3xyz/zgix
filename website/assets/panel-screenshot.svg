<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; }
      .surface2 { fill: #1c2129; }
      .line { stroke: #30363d; stroke-width: 1; fill: none; }
      .ink { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .accent { fill: #58a6ff; }
      .green { fill: #3fb950; }
      .amber { fill: #d29922; }
      .red { fill: #f85149; }
      .t-title { font-size: 15px; font-weight: 700; }
      .t-label { font-size: 11px; }
      .t-num { font-size: 12px; }
      .bar { fill: #58a6ff; opacity: 0.75; }
      .bar2 { fill: #3fb950; opacity: 0.65; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="750" rx="12"/>

  <!-- top bar -->
  <rect class="surface2" width="1200" height="52" rx="12"/>
  <rect class="surface2" x="0" y="26" width="1200" height="26"/>
  <rect class="line" x="0" y="52" width="1200" height="1"/>
  <circle class="red" cx="26" cy="26" r="6"/>
  <circle class="amber" cx="46" cy="26" r="6"/>
  <circle class="green" cx="66" cy="26" r="6"/>
  <text class="ink t-label" x="90" y="31">zgix panel — http://127.0.0.1:9100</text>
  <text class="accent t-label" x="1040" y="31">● live</text>

  <!-- left nav -->
  <rect class="line" x="190" y="52" width="1" height="698"/>
  <text class="accent t-title" x="28" y="92">zgix</text>
  <rect class="accent" x="0" y="112" width="3" height="30"/>
  <text class="ink t-label" x="28" y="132">概览 overview</text>
  <text class="muted t-label" x="28" y="170">站点 sites</text>
  <text class="muted t-label" x="28" y="208">应用 apps</text>
  <text class="muted t-label" x="28" y="246">关于 about</text>

  <!-- h3 listener table -->
  <text class="ink t-label" x="214" y="88">H3 LISTENERS</text>
  <rect class="surface" x="214" y="100" width="700" height="96" rx="8"/>
  <rect class="line" x="214" y="132" width="700" height="1"/>
  <rect class="line" x="214" y="164" width="700" height="1"/>
  <text class="muted t-label" x="230" y="122">bind</text>
  <text class="muted t-label" x="480" y="122">sessions</text>
  <text class="muted t-label" x="600" y="122">requests</text>
  <text class="muted t-label" x="730" y="122">parked</text>
  <text class="ink t-label" x="230" y="154">0.0.0.0:4443 (udp)</text>
  <text class="green t-num" x="480" y="154">17</text>
  <text class="ink t-num" x="600" y="154">12,884</text>
  <text class="ink t-num" x="730" y="154">3</text>
  <text class="ink t-label" x="230" y="186">0.0.0.0:8443 (udp)</text>
  <text class="green t-num" x="480" y="186">4</text>
  <text class="ink t-num" x="600" y="186">1,102</text>
  <text class="ink t-num" x="730" y="186">1</text>

  <!-- verdict bars -->
  <text class="ink t-label" x="214" y="240">H3 VERDICTS</text>
  <rect class="surface" x="214" y="252" width="340" height="180" rx="8"/>
  <text class="muted t-label" x="230" y="280">h3_responses</text>
  <rect class="bar2" x="230" y="288" width="270" height="14" rx="3"/>
  <text class="muted t-label" x="230" y="326">h3_bad_gateway</text>
