<!DOCTYPE html>
<html lang="en">
	<head id="head">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Page not found</title>
		<meta name="robots" content="noindex">
		<link rel="stylesheet" href="/zdoc.css">
		<!-- No theme script: this page has no sidebar to highlight and no
		     table of contents to spy on. -->
	</head>
	<body id="body">
		<!-- Generated at build time by zdoc rather than written by hand: a
		     static host serves this file for any URL it cannot find, and a
		     hand-written one drifts out of step with the theme the moment
		     either changes. -->
		<div class="notfound">
			<p class="notfound__code">404</p>
			<h1 class="notfound__title">This page does not exist</h1>
			<p class="notfound__body">
				The address may be mistyped, or the page may have been moved or
				renamed since the link was written.
			</p>
			<p class="notfound__actions">
				<a class="hero__action hero__action--brand" href="/">Back to the documentation</a>
			</p>
		</div>
	</body>
</html>
