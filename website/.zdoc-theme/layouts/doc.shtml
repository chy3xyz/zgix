<extend template="base.shtml">
<head id="head">
</head>
<nav id="sidebar">
	<div class="sidebar__group">Contents</div>
	<ul class="sidebar__list">
		<!-- The whole content tree, derived from the directory structure.
		     Entries are a flat list carrying their nesting depth, because
		     SuperHTML has no recursion; the `class` encodes the indentation.
		     A directory without a README renders as a plain label. -->
		<li :loop="$site.sidebar()">
			<ctx :if="$loop.it.is_link">
				<a class="$loop.it.class" href="$loop.it.link()" :text="$loop.it.title"></a>
			</ctx>
			<ctx :if="$loop.it.is_link.not()">
				<span class="$loop.it.class" :text="$loop.it.title"></span>
			</ctx>
		</li>
	</ul>
</nav>
<aside id="toc">
	<div :html="$page.toc()"></div>
</aside>
